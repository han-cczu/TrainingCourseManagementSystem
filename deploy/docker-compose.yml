# 本地一键启动：docker compose -f deploy/docker-compose.yml up -d --build
# 密码类变量仅为本地开发默认值；K8s 部署使用 Secret（见 deploy/k8s）
name: tcms

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: tcms
      MYSQL_USER: tcms
      MYSQL_PASSWORD: ${DB_PASSWORD:-tcms123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 走 TCP（-h 127.0.0.1），避免初始化阶段的临时实例被误判为就绪
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    image: tcms-backend:local
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-tcms123456}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Spring Boot 就绪后才算健康，`up --wait` 和前端的 depends_on 都会等到这一步
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 40

  frontend:
    build: ../frontend
    image: tcms-frontend:local
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
