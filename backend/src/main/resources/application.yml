server:
  port: 8080

spring:
  application:
    name: tcms
  jackson:
    deserialization:
      # 整数字段（例如课程容量）不能把 JSON 小数静默截断。
      accept-float-as-int: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tcms}?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:tcms}
    password: ${DB_PASSWORD:tcms123456}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  # 业务"当前时间"的时区（见技术设计 §5.4），与容器/JVM 时区无关
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  jwt:
    # 默认值仅供本地开发；prod profile 下仍为默认值会拒绝启动（ProdSafetyCheck）
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    ttl: 8h
  admin:
    # 首次启动、库中没有管理员时自动创建（技术设计 §4.2）
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin12345}
